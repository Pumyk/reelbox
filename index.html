<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0A0A0B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Reelbox</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<div id="app">

  <!-- ===================== HOME ===================== -->
  <section class="view" id="view-home" data-view="home">
    <header class="topbar">
      <div class="brand">
        <svg viewBox="0 0 24 24" class="brand-mark" aria-hidden="true">
          <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3h11A2.5 2.5 0 0 1 20 5.5v13a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 18.5v-13Z" fill="none" stroke="currentColor" stroke-width="1.7"/>
          <path d="M10.2 8.6v6.8l5.6-3.4-5.6-3.4Z" fill="currentColor"/>
        </svg>
        <span>Reelbox</span>
      </div>
      <button class="icon-btn" id="btn-search-home" aria-label="Search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m16.5 16.5 4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
    </header>
    <div class="scroll" id="home-scroll">
      <div id="home-hero" class="hero"></div>
      <div id="home-rows"></div>
      <div class="pad-bottom"></div>
    </div>
  </section>

  <!-- ===================== MOVIES ===================== -->
  <section class="view" id="view-movies" data-view="movies" hidden>
    <header class="topbar">
      <h1 class="page-title">Movies</h1>
      <button class="icon-btn" data-open-search aria-label="Search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m16.5 16.5 4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
    </header>
    <div class="chips" id="movie-chips"></div>
    <div class="scroll">
      <div class="grid" id="movie-grid"></div>
      <div class="pad-bottom"></div>
    </div>
  </section>

  <!-- ===================== SERIES ===================== -->
  <section class="view" id="view-series" data-view="series" hidden>
    <header class="topbar">
      <h1 class="page-title">Series</h1>
      <button class="icon-btn" data-open-search aria-label="Search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m16.5 16.5 4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
    </header>
    <div class="chips" id="series-chips"></div>
    <div class="scroll">
      <div class="grid" id="series-grid"></div>
      <div class="pad-bottom"></div>
    </div>
  </section>

  <!-- ===================== DOWNLOADS ===================== -->
  <section class="view" id="view-downloads" data-view="downloads" hidden>
    <header class="topbar">
      <h1 class="page-title">Downloads</h1>
      <span class="storage-pill" id="storage-pill">—</span>
    </header>
    <div class="scroll">
      <div id="download-list"></div>
      <div class="pad-bottom"></div>
    </div>
  </section>

  <!-- ===================== PROFILE ===================== -->
  <section class="view" id="view-profile" data-view="profile" hidden>
    <header class="topbar">
      <h1 class="page-title">Profile</h1>
    </header>
    <div class="scroll">
      <div class="profile-head">
        <div class="avatar">M</div>
        <div class="profile-meta">
          <div class="profile-name">My Library</div>
          <div class="profile-sub" id="profile-sub">Local profile</div>
        </div>
      </div>

      <div class="stat-row">
        <div class="stat"><div class="stat-num" id="stat-downloads">0</div><div class="stat-label">Downloaded</div></div>
        <div class="stat"><div class="stat-num" id="stat-watchlist">0</div><div class="stat-label">Watchlist</div></div>
        <div class="stat"><div class="stat-num" id="stat-history">0</div><div class="stat-label">Watched</div></div>
      </div>

      <div class="section-head"><h2>Continue Watching</h2><button class="link-btn" id="clear-history">Clear</button></div>
      <div class="row-track wrap" id="profile-history"></div>

      <div class="section-head"><h2>My Watchlist</h2></div>
      <div class="row-track wrap" id="profile-watchlist"></div>

      <div class="section-head"><h2>Preferences</h2></div>
      <div class="settings">
        <label class="setting">
          <span>Default quality</span>
          <select id="pref-quality">
            <option value="auto">Auto</option>
            <option value="hd">Best available</option>
            <option value="sd">Data saver</option>
          </select>
        </label>
        <label class="setting">
          <span>Autoplay next</span>
          <input type="checkbox" id="pref-autoplay" checked>
        </label>
        <label class="setting">
          <span>Wi-Fi only downloads</span>
          <input type="checkbox" id="pref-wifi">
        </label>
        <button class="danger-btn" id="clear-all">Clear all app data</button>
      </div>
      <div class="pad-bottom"></div>
    </div>
  </section>

  <!-- ===================== DETAIL ===================== -->
  <section class="view overlay-view" id="view-detail" data-view="detail" hidden>
    <div class="scroll" id="detail-scroll">
      <div id="detail-body"></div>
      <div class="pad-bottom"></div>
    </div>
    <button class="floating-back" id="detail-back" aria-label="Back">
      <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </section>

  <!-- ===================== SEARCH ===================== -->
  <section class="view overlay-view" id="view-search" data-view="search" hidden>
    <header class="topbar">
      <div class="search-field">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m16.5 16.5 4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <input id="search-input" type="search" placeholder="Search movies and series" autocomplete="off">
      </div>
      <button class="text-btn" id="search-cancel">Cancel</button>
    </header>
    <div class="scroll">
      <div class="grid" id="search-grid"></div>
      <div id="search-empty" class="empty" hidden>No results</div>
      <div class="pad-bottom"></div>
    </div>
  </section>

  <!-- ===================== PLAYER ===================== -->
  <div class="player" id="player" hidden>
    <video id="video" playsinline webkit-playsinline></video>
    <div class="player-top">
      <button class="icon-btn on-dark" id="player-close" aria-label="Close">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <div class="player-title" id="player-title"></div>
      <button class="icon-btn on-dark" id="player-quality" aria-label="Quality">
        <svg viewBox="0 0 24 24"><path d="M12 3v18M5 8l7-5 7 5M5 16l7 5 7-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
    <div class="player-center">
      <button class="seek-btn" id="seek-back"><svg viewBox="0 0 24 24"><path d="M11 5 4 12l7 7M20 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>10</span></button>
      <button class="play-btn" id="play-toggle"><svg viewBox="0 0 24 24" id="play-icon"><path d="M7 4.5v15l13-7.5L7 4.5Z" fill="currentColor"/></svg></button>
      <button class="seek-btn" id="seek-fwd"><svg viewBox="0 0 24 24"><path d="m13 5 7 7-7 7M4 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>10</span></button>
    </div>
    <div class="player-bottom">
      <div class="scrub-wrap">
        <span class="time" id="time-cur">0:00</span>
        <input type="range" class="scrub" id="scrub" min="0" max="100" value="0" step="0.1">
        <span class="time" id="time-dur">0:00</span>
      </div>
      <div class="player-controls">
        <button class="icon-btn on-dark" id="player-speed" aria-label="Speed"><span class="speed-label">1x</span></button>
        <button class="icon-btn on-dark" id="player-mute" aria-label="Mute">
          <svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4Z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
        <button class="icon-btn on-dark" id="player-full" aria-label="Fullscreen">
          <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </div>
    <div class="sheet" id="quality-sheet" hidden>
      <div class="sheet-inner">
        <div class="sheet-title">Streaming quality</div>
        <div id="quality-options"></div>
      </div>
    </div>
  </div>

  <!-- ===================== DOWNLOAD SHEET ===================== -->
  <div class="sheet modal" id="download-sheet" hidden>
    <div class="sheet-inner">
      <div class="sheet-title" id="dl-sheet-title">Download</div>
      <div id="download-options"></div>
      <button class="text-btn sheet-cancel" id="download-cancel">Cancel</button>
    </div>
  </div>

  <!-- ===================== NAV ===================== -->
  <nav class="bottomnav" id="bottomnav">
    <button class="nav-item active" data-go="home">
      <svg viewBox="0 0 24 24"><path d="M4 10.5 12 3l8 7.5V20a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 20v-9.5Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
      <span>Home</span>
    </button>
    <button class="nav-item" data-go="movies">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M8 4v16M16 4v16M3 12h18" stroke="currentColor" stroke-width="1.4"/></svg>
      <span>Movies</span>
    </button>
    <button class="nav-item" data-go="series">
      <svg viewBox="0 0 24 24"><rect x="2.5" y="6" width="19" height="12.5" rx="2.2" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M8 6 11 3M16 6l-3-3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <span>Series</span>
    </button>
    <button class="nav-item" data-go="downloads">
      <svg viewBox="0 0 24 24"><path d="M12 3v11m0 0 4-4m-4 4-4-4M4.5 17.5v1.5A2 2 0 0 0 6.5 21h11a2 2 0 0 0 2-2v-1.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Downloads</span>
    </button>
    <button class="nav-item" data-go="profile">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="3.8" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M4.5 20.5a7.5 7.5 0 0 1 15 0" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
      <span>Profile</span>
    </button>
  </nav>

</div>

<script src="js/app.js"></script>
</body>
</html>
